<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canvas Star Emitter</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="playfield" aria-label="A blue square follows the pointer and releases colorful stars when clicked"></canvas>

  <script>
    const canvas = document.querySelector("#playfield");
    const context = canvas.getContext("2d");
    const squareSize = 24 * (96 / 72); // 24 pt, converted to CSS pixels.
    const pointSize = 96 / 72; // Convert typographic points to CSS pixels.
    const pointer = { x: 0, y: 0 };
    const particles = [];

    function resizeCanvas() {
      const pixelRatio = window.devicePixelRatio || 1;
      canvas.width = Math.round(canvas.clientWidth * pixelRatio);
      canvas.height = Math.round(canvas.clientHeight * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      draw();
    }

    function drawStar(x, y, size, rotation) {
      const innerRadius = size * 0.45;
      context.beginPath();

      for (let point = 0; point < 10; point += 1) {
        const radius = point % 2 === 0 ? size : innerRadius;
        const angle = -Math.PI / 2 + (point * Math.PI) / 5 + rotation;
        const starX = x + Math.cos(angle) * radius;
        const starY = y + Math.sin(angle) * radius;

        if (point === 0) {
          context.moveTo(starX, starY);
        } else {
          context.lineTo(starX, starY);
        }
      }

      context.closePath();
      context.fill();
    }

    function draw() {
      context.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

      for (const particle of particles) {
        context.globalAlpha = particle.life;
        context.fillStyle = particle.color;
        drawStar(particle.x, particle.y, particle.size, particle.rotation);
      }

      context.globalAlpha = 1;
      context.fillStyle = "blue";
      context.fillRect(
        pointer.x - squareSize / 2,
        pointer.y - squareSize / 2,
        squareSize,
        squareSize
      );
    }

    function emitStars(x, y) {
      const count = Math.floor(Math.random() * 10) + 6;

      for (let index = 0; index < count; index += 1) {
        const angle = Math.random() * Math.PI * 2;
        const hue = Math.random() * 120;

        particles.push({
          x,
          y,
          velocityX: Math.cos(angle) * 0.6,
          velocityY: Math.sin(angle) * 0.6,
          rotation: 0,
          rotationSpeed: 0.02,
          size: (Math.random() * 4 + 8) * pointSize,
          color: `hsl(${hue} 100% 50%)`,
          life: 1
        });
      }
    }

    function animate() {
      for (let index = particles.length - 1; index >= 0; index -= 1) {
        const particle = particles[index];
        particle.x += particle.velocityX;
        particle.y += particle.velocityY;
        particle.rotation += particle.rotationSpeed;
        particle.life -= 0.004;

        if (particle.life <= 0) {
          particles.splice(index, 1);
        }
      }

      draw();
      requestAnimationFrame(animate);
    }

    canvas.addEventListener("pointermove", (event) => {
      const bounds = canvas.getBoundingClientRect();
      pointer.x = event.clientX - bounds.left;
      pointer.y = event.clientY - bounds.top;
      draw();
    });

    canvas.addEventListener("pointerdown", (event) => {
      const bounds = canvas.getBoundingClientRect();
      pointer.x = event.clientX - bounds.left;
      pointer.y = event.clientY - bounds.top;
      emitStars(pointer.x, pointer.y);
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    animate();
  </script>
</body>
</html>
